<!DOCTYPE html>
<html>
<head>
    <title>Modifier Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="mb-4 text-center">✏️ Modifier Contact</h2>

            <form method="POST" class="card p-4 shadow-sm">

                <!-- NOM -->
                <div class="mb-3">
                    <label class="form-label">Nom</label>
                    <input name="nom" value="{{ contact['nom'] }}" class="form-control" required>
                </div>

                <!-- EMAIL -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" value="{{ contact['email'] }}" class="form-control" required>
                </div>

                <!-- TELEPHONE -->
                <div class="mb-3">
                    <label class="form-label">Téléphone</label>
                    <input type="tel" name="telephone" value="{{ contact['telephone'] }}" class="form-control" required>
                </div>

                <!-- CATEGORIE -->
                <div class="mb-3">
                    <label class="form-label">Catégorie</label>
                    <select name="categorie" class="form-control">
                        <option value="{{ contact['categorie'] }}">{{ contact['categorie'] }}</option>
                        <option value="Patient">Patient</option>
                        <option value="Fournisseur">Fournisseur</option>
                        <option value="Laboratoire">Laboratoire</option>
                        <option value="Entreprise">Entreprise</option>
                    </select>
                </div>

                <!-- ADRESSE -->
                <div class="mb-3">
                    <label class="form-label">Adresse</label>
                    <input name="adresse" value="{{ contact['adresse'] }}" class="form-control">
                </div>

                <!-- FONCTION -->
                <div class="mb-3">
                    <label class="form-label">Fonction</label>
                    <input name="fonction" value="{{ contact['fonction'] }}" class="form-control">
                </div>

                <!-- ENTREPRISE -->
                <div class="mb-3">
                    <label class="form-label">Entreprise</label>
                    <input name="entreprise" value="{{ contact['entreprise'] }}" class="form-control">
                </div>

                <!-- BUTTONS -->
                <div class="d-flex justify-content-between">

                    <button type="submit" class="btn btn-primary">
                        Modifier
                    </button>

                    <a href="/" class="btn btn-secondary">
                        Retour
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
