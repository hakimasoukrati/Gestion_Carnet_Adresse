<!DOCTYPE html>
<html>
<head>
    <title>Contacts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4 text-center">📒 Contact List</h2>

    <div class="d-flex justify-content-between mb-3">
        <a href="/add" class="btn btn-primary">+ Ajouter Contact</a>

        <form action="/search" method="get" class="d-flex">
            <input type="text" name="q" class="form-control me-2" placeholder="Rechercher...">
            <button class="btn btn-success">Search</button>
        </form>
    </div>

    <table class="table table-striped table-hover shadow-sm bg-white">
        <thead class="table-dark">
            <tr>
                <th>Nom</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for c in contacts %}
            <tr>
                <td>{{ c["nom"] }}</td>
                <td>{{ c["email"] }}</td>
                <td>{{ c["telephone"] }}</td>
                <td>
                    <a href="/edit/{{ c['id'] }}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="/delete/{{ c['id'] }}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Supprimer ce contact ?')">
                       Delete
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
