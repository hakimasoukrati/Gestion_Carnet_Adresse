<!DOCTYPE html>
<html>
<head>
    <title>Ajouter Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4 text-center">➕ Ajouter Contact</h2>

    <form method="POST" class="card p-4 shadow-sm">

        <label>Nom</label>
        <input name="nom" class="form-control mb-3" placeholder="Nom">

        <label>Email</label>
        <input name="email" class="form-control mb-3" placeholder="Email">

        <label>Téléphone</label>
        <input name="telephone" class="form-control mb-3" placeholder="Téléphone">

        <button class="btn btn-success">Ajouter</button>

        <a href="/" class="btn btn-secondary mt-2">Retour</a>

    </form>

</div>

</body>
</html>
