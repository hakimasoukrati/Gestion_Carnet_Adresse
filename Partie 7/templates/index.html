<!DOCTYPE html>
<html>
<head>
    <title>Contacts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- TITLE -->
    <h2 class="mb-4 text-center">📒 Contact Management System</h2>

    <!-- ACTION BAR -->
    <div class="d-flex justify-content-between align-items-center mb-3">

        <a href="/add" class="btn btn-primary">
            + Ajouter Contact
        </a>

        <form action="/search" method="get" class="d-flex">
            <input type="text" name="q" class="form-control me-2" placeholder="Rechercher...">
            <button class="btn btn-success">Search</button>
        </form>

    </div>

    <!-- TABLE -->
    <div class="card shadow-sm">
        <div class="card-body p-0">

            <table class="table table-striped table-hover mb-0">

                <thead class="table-dark">
                    <tr>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    {% for c in contacts %}
                    <tr>

                        <td>
                            <span class="fw-bold">{{ c["nom"] }}</span>
                        </td>

                        <td>
                            <span class="text-primary">{{ c["email"] }}</span>
                        </td>

                        <td>
                            <span class="text-success">{{ c["telephone"] }}</span>
                        </td>

                        <td>

                            <!-- ACTIONS GROUP -->
                            <div class="d-flex gap-1 flex-wrap">

                                <a href="/edit/{{ c['id'] }}" class="btn btn-warning btn-sm">
                                    Edit
                                </a>

                                <a href="/delete/{{ c['id'] }}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Supprimer ce contact ?')">
                                    Delete
                                </a>

                                <a href="/send_email/{{ c['id'] }}" class="btn btn-info btn-sm">
                                    Email 📩
                                </a>

                                <a href="/send_whatsapp/{{ c['id'] }}" class="btn btn-success btn-sm">
                                    WhatsApp 💬
                                </a>

                            </div>

                        </td>

                    </tr>
                    {% endfor %}

                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
