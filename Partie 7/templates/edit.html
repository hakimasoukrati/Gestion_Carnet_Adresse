<!DOCTYPE html>
<html>
<head>
    <title>Modifier Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4 text-center">✏️ Modifier Contact</h2>

    <form method="POST" class="card p-4 shadow-sm">

        <label>Nom</label>
        <input name="nom" value="{{ contact['nom'] }}" class="form-control mb-3">

        <label>Email</label>
        <input name="email" value="{{ contact['email'] }}" class="form-control mb-3">

        <label>Téléphone</label>
        <input name="telephone" value="{{ contact['telephone'] }}" class="form-control mb-3">

        <button class="btn btn-primary">Modifier</button>

        <a href="/" class="btn btn-secondary mt-2">Retour</a>

    </form>

</div>

</body>
</html>
